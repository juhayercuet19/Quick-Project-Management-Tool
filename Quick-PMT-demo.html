 else if(a==="pdf"){const d=$("#dlg");d.innerHTML=`<h2>Download bill PDF</h2><label style="margin-top:12px">Company name (printed at the top of the bill)<input id="cname" placeholder="Enter company name" autocomplete="off"></label><div id="cmsg" class="bad" role="alert" style="margin-bottom:8px"></div><div class="row"><button class="btn hi" data-a="pdfgo" data-id="${id}">Download PDF</button><button class="btn ghost" data-a="close">Cancel</button></div>`;d.showModal()}
 else if(a==="pdfgo")run(async()=>{const nm=$("#cname").value.trim();if(!nm){$("#cmsg").textContent="Enter the company name.";return}const bl=C.bills.find(x=>x.id===id);if(!downloads)throw new Error("Downloads are not available");
  await downloads.save({filename:`${bl.no}-${bl.subName.replace(/[^A-Za-z0-9]+/g,"-")}.pdf`,data:billPdf(bl,nm)});$("#dlg").close()})
 else if(a==="rall"){S.bf="";S.bt="";render()}
 else if(a==="close")$("#dlg").close();
 else if(a==="seed")run(async()=>{if(k==="items")for(const[n,u,r]of STARTER_ITEMS)await coll("items").doc(uid()).set({pid:S.pid,name:n,unit:u,rate:r,target:0,created:Date.now()});
  else for(const[n,s]of STARTER_SUBS)await coll("subs").doc(uid()).set({pid:S.pid,n,scope:s,due:"",done:"",rate:0.5,cap:10,created:Date.now()})});
 else if(a==="savework")run(async()=>{const d=$("#dlg"),{o,it}=entryVals();if(!(o.qty>0)){alert("Enter the measurements first");return}
  const data={pid:S.pid,rm:d.querySelector("[name=rm]").value.trim(),date:d.querySelector("[name=date]").value,sub:d.querySelector("[name=sub]").value,item:it.id,iname:it.name,unit:it.unit,...o};
  const eid=d.dataset.id;if(eid)await coll("work").doc(eid).update(data);else{data.created=Date.now();await coll("work").doc(uid()).set(data)}
  S.date=data.date;d.close();render()});
 else if(a==="save")run(async()=>{const data={};$("#dlg").querySelectorAll("[name]").forEach(i=>{const t=SCH[k].f.find(f=>f[0]===i.name)[2];data[i.name]=t==="number"?(parseFloat(i.value)||0):i.value.trim()});
  if(k==="projects"){const pw=data.pw;delete data.pw;const old=C.projects.find(x=>x.id===id);
   if(!id&&(!data.cid||!pw)){alert("Enter a project ID and password");return}
   if(pw){data.cs=uid()+uid();data.ch=await pbk(data.cid+"\n"+pw,data.cs)}else if(old&&old.ch&&data.cid!==old.cid){alert("Changing the project ID needs a new password too.");return}}
  if(k==="penalties"&&(data.desc==="__new"||data.desc==="__other")){const kind=data.desc,tx=$("#dtxt").value.trim();if(!tx){alert("Write the reason");return}data.desc=tx;
   if(kind==="__new"&&!C.reasons.some(z=>z.pid===S.pid&&z.name===tx))await coll("reasons").doc(uid()).set({pid:S.pid,name:tx,type:data.type,val:data.val,mult:data.mult,created:Date.now()})}
  if(k!=="projects")data.pid=S.pid;const nid=id||uid();
  if(id)await coll(k).doc(id).update(data);else{data.created=Date.now();await coll(k).doc(nid).set(data)}
  $("#dlg").close();if(k==="projects"&&!id){S.pid=nid;S.tab="Overview"}render()});
 else if(a==="del"){if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Confirm delete";setTimeout(()=>{b.dataset.sure="";b.textContent="Delete"},3500);return}
  run(async()=>{if(k==="projects"){for(const c of KINDS.filter(x=>!["projects","profiles"].includes(x)))for(const r of C[c].filter(r=>r.pid===id))await coll(c).doc(r.id).delete();S.pid=null}
   await coll(k).doc(id).delete()})}
 else if(a==="attach"){window._att={k,id};$("#file").accept=".pdf,image/*,.dwg,.dxf";$("#file").click()}
 else if(a==="csv")run(async()=>{const csv=window._rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");await downloads.save({filename:"report-"+S.rep+"-"+today+".csv",data:csv})});
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.a==="date"&&t.value){S.date=t.value;S.month=t.value.slice(0,7);render()}
 if(t.dataset.a==="check"){const bl=C.bills.find(x=>x.id===t.dataset.id);if(bl)bl.checked=t.checked;render();run(()=>coll("bills").doc(t.dataset.id).update({checked:t.checked}))}
 if(t.dataset.a==="target"){const key=S.pid+"_"+t.dataset.item+"_"+S.date,v=parseFloat(t.value)||0,o=C.targets.find(x=>x.id===key);
  if(o)o.target=v;else C.targets.push({id:key,pid:S.pid,item:t.dataset.item,date:S.date,target:v});render();
  run(()=>coll("targets").doc(key).set({pid:S.pid,item:t.dataset.item,date:S.date,target:v}))}
 if(/_u$/.test(t.name||"")&&t.closest("#dlg")){const inp=$("#dlg").querySelector(`[name=${t.name.slice(0,-2)}]`);if(inp.value!=="")inp.value=r6(parseFloat(inp.value)*F[t.dataset.prev]/F[t.value]);t.dataset.prev=t.value;syncEntry(false)}
 if(t.dataset.a==="rfrom"){S.bf=t.value;render()}
 if(t.dataset.a==="rto"){S.bt=t.value;render()}
 if(t.name==="item"&&t.closest("#dlg"))syncEntry(true);
 if(t.name==="desc"&&t.closest("#dlg"))reasonPrefill();
 if(t.id==="up")run(async()=>{for(const f of t.files){const r=await assets.upload(f);await coll("media").doc(uid()).set({pid:S.pid,c:f.name,d:today,aid:r.id,type:f.type,created:Date.now()})}});
 if(t.id==="file"&&t.files[0]&&window._att)run(async()=>{const r=await assets.upload(t.files[0]);await coll(window._att.k).doc(window._att.id).update({aid:r.id});t.value=""});
});
document.addEventListener("input",e=>{if(e.target.closest("#dlg")){if($("#calc"))syncEntry(false);if($("#rcalc"))relPreview()}});
(async()=>{
 try{db=await claude.use("db");user=await claude.use("user");assets=await claude.use("assets");downloads=await claude.use("downloads")}catch(e){}
 if(db&&user){me=await user.me();
  KINDS.forEach(k=>coll(k).onSnapshot(s=>{C[k]=s.docs.map(d=>({id:d.id,...d.data()}));
   if(!$("#dlg").open&&!(document.activeElement&&document.activeElement.matches("input,select")))render()},()=>{}))}
 if(me&&!me.canEdit)document.body.classList.add("ro");
 ready=true;render();
})();
</script></body></html>
